<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <style>
    .brand-color {
      stroke: #000000;
    }
    .brand-fill {
      fill: #000000;
    }
    @media (prefers-color-scheme: dark) {
      .brand-color {
        stroke: #ffffff;
      }
      .brand-fill {
        fill: #ffffff;
      }
    }
  </style>
  
  <!-- Diamond Outline -->
  <polygon points="60,30 140,30 170,65 100,135 30,65" class="brand-color" stroke-width="8" stroke-linejoin="round" fill="none"/>
  
  <!-- Facet lines -->
  <line x1="60" y1="30" x2="75" y2="65" class="brand-color" stroke-width="8" stroke-linecap="round"/>
  <line x1="140" y1="30" x2="125" y2="65" class="brand-color" stroke-width="8" stroke-linecap="round"/>
  <line x1="75" y1="65" x2="125" y2="65" class="brand-color" stroke-width="8" stroke-linecap="round"/>
  <line x1="30" y1="65" x2="75" y2="65" class="brand-color" stroke-width="8" stroke-linecap="round"/>
  <line x1="170" y1="65" x2="125" y2="65" class="brand-color" stroke-width="8" stroke-linecap="round"/>
  <line x1="60" y1="30" x2="100" y2="135" class="brand-color" stroke-width="6" stroke-linecap="round"/>
  <line x1="140" y1="30" x2="100" y2="135" class="brand-color" stroke-width="6" stroke-linecap="round"/>
  <line x1="75" y1="65" x2="100" y2="135" class="brand-color" stroke-width="8" stroke-linecap="round"/>
  <line x1="125" y1="65" x2="100" y2="135" class="brand-color" stroke-width="8" stroke-linecap="round"/>

  <!-- Tilted A & P Letters -->
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="60" class="brand-fill" transform="translate(18, 142) rotate(-22)">A</text>
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="60" class="brand-fill" transform="translate(126, 142) rotate(22)">P</text>
</svg>